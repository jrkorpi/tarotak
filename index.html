
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Tarot AK</title>
  <link rel="icon" type="image/png" href="tarotak.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Tarot AK, Alaska, Tarot.">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffea00; 
      color: #000000;           
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .loviz {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .content {
      width: 100%;
      max-width: 90%;
    }

    .container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0 2vw; 
      box-sizing: border-box; 
      overflow: hidden;
    }

    .spread {
      position: absolute;
      top: 52%;
      left: 50%;
      opacity: 0.93;
      transform: translate(-50%, -50%) ;  
      width: auto;
      height: min(36vw, 62vh);
      min-height: 160px;
      max-height: 520px;
      min-width: 160px;
      max-width: 80vw;
      z-index: 2; 
    }

    .opentext {
      font-family: 'Arial Black', sans-serif;
      font-size: min(54vw, 95vh);
      line-height: 0.8;
      margin: 0;
      color: transparent;
      -webkit-text-stroke: 0.5vw #000000;
      paint-order: stroke fill;
      user-select: none;
      pointer-events: none; 
      z-index: 1; 
    }

    .footer-text {
      position: fixed;
      bottom: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #4b0082;
      z-index: 3;
    }

     .footer-text a {
      color: #4b0082;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

   .footer-text a:hover {
      text-decoration: underline;
             opacity: 0.7;
        color: #00ff00;
    }
      
  </style>
</head>

<body>
  <main class="content">
    <div class="container">
      <h1 class="loviz">Tarot AK Alaska Tarot.</h1>
      <!-- <h1>Hello World, <br> see you soon!</h1> -->
      <img src="907-Tarot-AK.png" alt="Tarot AK Alaska Tarot" class="spread">
      <h1 class="opentext">907</h1>
    </div>
  </main>
  <footer class="footer-text">
    ♧♡♤♢ charmed by <a href="https://highkeyarts.com" target="_blank" rel="noopener noreferrer">High Key Arts</a> ♢♤♡♧
  </footer>
    
</body>
</html>
