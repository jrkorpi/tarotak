
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Tarot AK</title>
  <link rel="icon" type="image/png" href="tarotak.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Tarot AK, Alaska, Tarot.">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffea00; 
      color: #000000;           
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .content-box {
      max-width: 90%;
    }

    .message-text {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .center-image {
      max-width: 100%;
      height: auto;
    }
    
.hero-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100vh;
  padding: 0 2vw; 
  box-sizing: border-box; 
  overflow: hidden;
}

.outline-text {
  font-family: 'Arial Black', Impact, sans-serif;
  font-size: min(44vw, 75vh);
  line-height: 0.8;
  margin: 0;
  color: transparent;
  -webkit-text-stroke: 0.35vw #000000; 
  paint-order: stroke fill; 
  user-select: none;
}
    
  </style>
</head>
<body>

  <main class="content-box">

    <h1 class="visually-hidden">Tarot AK Alaska Tarot.</h1>
   <!-- <h1>Hello World, <br> see you soon!</h1> -->
    <img src="907-Tarot-AK.png" alt="Tarot AK Alaska Tarot" class="center-image">

<div class="hero-container">
  <h1 class="outline-text">907</h1>
</div>
    
  </main>

</body>
</html>
